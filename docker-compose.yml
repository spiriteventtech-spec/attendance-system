version: '3.9'

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 (Caching & Socket.io) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── InfluxDB 2.7 (GPS Time-Series) ───────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: attendance_influx
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=influx_dev_password
      - DOCKER_INFLUXDB_INIT_ORG=eventstrack
      - DOCKER_INFLUXDB_INIT_BUCKET=gps_pings
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my_secure_influx_token_12345
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: postgres_dev_password
      JWT_SECRET: change_this_in_production_use_a_long_random_value
      JWT_EXPIRES_IN: 8h
      # ── AWS Rekognition (Selfie Verification) ──────────────
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      REKOGNITION_CONFIDENCE_THRESHOLD: 80
      # ── SMTP Email Alerts ──────────────────────────────────
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # ── Security Settings ──────────────────────────────────
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # ── Redis Config ───────────────────────────────────────
      REDIS_URL: redis://redis:6379
      # ── InfluxDB Config ────────────────────────────────────
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: my_secure_influx_token_12345
      INFLUX_ORG: eventstrack
      INFLUX_BUCKET: gps_pings
      # ── AWS S3 (Photo Storage) ─────────────────────────────
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"

  # ── Admin Dashboard ───────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: attendance_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3002:80"

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  influxdb_data:
