_format_version: "3.0"
_transform: true

services:
  - name: attendance-backend
    url: http://backend:3001
    routes:
      - name: api-routes
        paths:
          - /api
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      second: 5
      hour: 10000
      policy: local
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Device-ID
        - X-Nonce
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
